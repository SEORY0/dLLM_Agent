[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dllm-agent"
version = "0.1.0"
description = "Deterministic replay-based dLLM vulnerability discovery MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "rich>=14,<15", "typer>=0.16,<1"]

[project.scripts]
dllm-agent = "dllm_agent.cli:app"

[dependency-groups]
dev = ["basedpyright>=1.31", "pytest>=8.4", "ruff>=0.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/dllm_agent"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
reportUnusedCallResult = "warning"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnusedVariable = "error"
reportMissingParameterType = "error"
reportPrivateUsage = "error"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001", "FBT001", "FBT002", "TD002", "TD003", "FIX002"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "SLF001", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
